name=MaxwellTrack
version=1.1.0
author=MaxwellTrack
maintainer=MaxwellTrack <support@maxwelltrack.com>
sentence=Connect any Arduino board to the MaxwellTrack IoT cloud over WiFi or cellular (GSM/LTE).
paragraph=Encrypted, per-device secure connection. Send readings to datastreams, receive dashboard commands, offline buffering, automatic reconnect and over-the-air updates. ESP32/ESP8266 connect over WiFi; any supported board connects over a SIM800 or SIM7600 modem. Provide only your Device ID and Auth Token from the dashboard.
category=Communication
url=https://maxwelltrack.com
architectures=esp32,esp8266,stm32,rp2040,samd,avr
depends=PubSubClient
precompiled=true
ldflags=-lmt_esp32_v2 -lmt_esp32_v3 -lmt_esp8266_v3 -lmt_stm32 -lmt_rp2040 -lmt_samd -lmt_avr

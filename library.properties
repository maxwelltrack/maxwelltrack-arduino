name=MaxwellTrack
version=1.1.0
author=MaxwellTrack
maintainer=MaxwellTrack <support@maxwelltrack.com>
sentence=Connect any Arduino board to the MaxwellTrack IoT cloud over WiFi or cellular (GSM/LTE).
paragraph=Secure per-device MQTT over TLS. Send telemetry to datastreams, receive dashboard commands, with automatic reconnect and heartbeats. WiFi is optional: ESP32/ESP8266 connect over WiFi, and any board (including non-WiFi MCUs) connects over a cellular modem via an external Client transport. Provide only your Device ID and Auth Token from the dashboard.
category=Communication
url=https://maxwelltrack.com
architectures=esp32,esp8266,stm32,rp2040,samd,avr
depends=PubSubClient
precompiled=true
ldflags=-lmt_esp32_v2 -lmt_esp32_v3 -lmt_esp8266_v3 -lmt_stm32 -lmt_rp2040 -lmt_samd -lmt_avr

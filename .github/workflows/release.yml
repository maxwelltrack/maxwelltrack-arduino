name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release for the version in library.properties
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version=//p' library.properties | tr -d '\r')
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released"
            exit 0
          fi
          mkdir -p /tmp/pkg/MaxwellTrack
          git archive HEAD | tar -x -C /tmp/pkg/MaxwellTrack
          rm -rf /tmp/pkg/MaxwellTrack/.github
          (cd /tmp/pkg && zip -qr "MaxwellTrack-$version.zip" MaxwellTrack)
          awk -v v="## $version" '$0 == v {on=1; next} on && /^## / {exit} on' CHANGELOG.md > /tmp/notes.md
          gh release create "$tag" "/tmp/pkg/MaxwellTrack-$version.zip" --target "$GITHUB_SHA" \
            --title "MaxwellTrack $version" --notes-file /tmp/notes.md --latest
